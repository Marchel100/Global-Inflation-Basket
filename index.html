function Row({item,mi,depth,allData,idx}){
  const[open,setOpen]=useState(depth===0);
  var lvl=item[0],name=item[1],weight=item[2],vals=item[3];
  var rate=vals[mi];
  var isL0=lvl===0,isL1=lvl===1;

  // Find children: items after this one with level > this level, until we hit same or lower level
  var children=[];
  for(var j=idx+1;j<allData.length;j++){
    if(allData[j][0]<=lvl)break;
    if(allData[j][0]===lvl+1)children.push({item:allData[j],idx:j});
  }
  var hasChildren=children.length>0;
  var barMax=10;
  var barW=Math.min(Math.abs(rate||0)/barMax*50,50);
  var padL=depth===0?0:depth===1?20:depth===2?44:64;

  return(
    <div>
      <div onClick={()=>hasChildren&&setOpen(!open)} style={{
        display:"flex",alignItems:"center",padding:isL0?"10px 14px":"7px 14px",paddingLeft:14+padL,
        borderBottom:isL0?"1px solid "+P.border:"0.5px solid "+P.gridLine,
        background:isL0?"#f0f9ff":open&&isL1?"#fafbfc":"transparent",
        cursor:hasChildren?"pointer":"default",
        transition:"background 0.15s",
      }}>
        <div style={{flex:1,fontSize:isL0?15:isL1?14:depth===2?13:12,fontWeight:isL0?700:isL1?500:400,
          color:isL0?P.navy:isL1?P.text:P.textMid,display:"flex",alignItems:"center",gap:6}}>
          {hasChildren&&<span style={{color:P.textLight,fontSize:10,display:"inline-block",
            transform:open?"rotate(90deg)":"rotate(0)",transition:"transform 0.2s",width:14,textAlign:"center"}}>▶</span>}
          {!hasChildren&&<span style={{width:14}}/>}
          {name}
        </div>
        <div style={{width:65,textAlign:"right",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",color:P.textLight}}>{weight.toFixed(1)}</div>
        <div style={{width:55,textAlign:"right",fontSize:isL0?16:14,fontFamily:"'IBM Plex Mono',monospace",
          fontWeight:isL0?700:500,color:rate===null?P.textLight:rate>=0?P.red:P.green}}>
          {rate!==null?rate.toFixed(1):"–"}
        </div>
        <div style={{width:100,height:14,position:"relative",marginLeft:10}}>
          <div style={{position:"absolute",left:"50%",top:0,bottom:0,width:1,background:P.border}}/>
          {rate!==null&&rate>=0&&<div style={{position:"absolute",left:"50%",top:0,bottom:0,width:barW+"%",background:"rgba(220,38,38,0.15)",borderRadius:3}}/>}
          {rate!==null&&rate<0&&<div style={{position:"absolute",right:"50%",top:0,bottom:0,width:barW+"%",background:"rgba(22,163,74,0.15)",borderRadius:3}}/>}
        </div>
      </div>
      {open&&children.map(c=><Row key={c.idx} item={c.item} mi={mi} depth={depth+1} allData={allData} idx={c.idx}/>)}
    </div>
  );
}

            <span style={{width:65,textAlign:"right",fontSize:11,color:P.textLight,fontFamily:"'IBM Plex Mono',monospace",textTransform:"uppercase",letterSpacing:"0.06em"}}>Weight</span>
            <span style={{width:55,textAlign:"right",fontSize:11,color:P.textLight,fontFamily:"'IBM Plex Mono',monospace",textTransform:"uppercase",letterSpacing:"0.06em"}}>YoY %</span>
            <span style={{width:100,textAlign:"center",marginLeft:10,fontSize:9,color:P.textLight,fontFamily:"'IBM Plex Mono',monospace"}}>← deflation | inflation →</span>
          </div>
          {data.length>0&&<Row item={data[0]} mi={mi} depth={0} allData={data} idx={0}/>}
        </div>

        <div style={{fontSize:10,color:P.textLight,fontFamily:"'IBM Plex Mono',monospace",marginTop:16,textAlign:"center"}}>
          Source: ABS CPI · Saltmarsh Economics © 2026
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
} catch(e) {
  document.getElementById('root').textContent = 'CATCH: ' + e.message;
}
</script>
</body>
</html>
